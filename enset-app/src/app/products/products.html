<div class="p-3">
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Selected</th>
                </tr>
            </thead>
            @if (products){
            <tbody>
                @for(p of products; track p){
                <tr>
                    <td>{{p.id}}</td>
                    <td>{{p.name}}</td>
                    <td>{{p.price}}</td>
                    <td>
                        @if(p.selected){
                        <span class="badge bg-success">Selected</span>
                        } @else {
                        <span class="badge bg-secondary">Not Selected</span>
                        }
                    </td>
                    <td>
                        <button (click)="deleteProduct(p)" class="btn btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                }

            </tbody>
            }

        </table>
    </div>
</div>
